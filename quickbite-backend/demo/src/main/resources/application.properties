# ==============================
# QuickBite - Production Config
# ==============================

server.port=${PORT:8080}

# ==============================
# Database - Railway MySQL
# ==============================

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==============================
# Email / Gmail SMTP
# ==============================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${QUICKBITE_MAIL_USERNAME}
spring.mail.password=${QUICKBITE_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.required=true
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.quitwait=false
spring.mail.properties.mail.debug=false

# ==============================
# QuickBite Admin
# ==============================

quickbite.admin.email=${QUICKBITE_ADMIN_EMAIL:}
quickbite.admin.name=${QUICKBITE_ADMIN_NAME:QuickBite Admin}
quickbite.admin.phone=${QUICKBITE_ADMIN_PHONE:}
quickbite.admin.password=${QUICKBITE_ADMIN_PASSWORD:}

# ==============================
# Razorpay
# ==============================

razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# ==============================
# Logging
# ==============================

logging.level.org.springframework=INFO
logging.level.com.example.demo=INFO
logging.level.org.springframework.security=INFO